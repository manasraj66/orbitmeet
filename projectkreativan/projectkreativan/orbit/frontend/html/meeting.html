<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Orbit Meet — Video Room</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b16;color:#f5f6ff;font:16px Inter,Segoe UI,Arial,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid #282b43}.brand{font-weight:800;color:#a99cff}.meta{color:#aeb4cc;font-size:14px}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0 0 8px}.code{color:#bcb4ff}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:22px}.tile{position:relative;min-height:240px;background:#15182a;border:1px solid #343752;border-radius:16px;overflow:hidden;display:grid;place-items:center}.tile video{width:100%;height:100%;min-height:240px;object-fit:cover}.label{position:absolute;bottom:12px;left:12px;background:#090b16cc;padding:6px 10px;border-radius:8px;font-size:13px}.placeholder{color:#aeb4cc}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.controls button,.copy{border:0;border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer;background:#7564f5;color:white}.controls .off{background:#343752}.controls .end{background:#dc4664}#status{color:#bfc4ff;text-align:center;min-height:24px}.back{color:#bcb4ff;text-decoration:none}.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:20px}.panel{background:#121528;border:1px solid #343752;border-radius:14px;padding:14px}.panel h2{font-size:17px;margin:0 0 10px}.panel input,.panel button{padding:10px;border-radius:8px;border:1px solid #343752;background:#20243b;color:#fff}.panel button{cursor:pointer;background:#7564f5;border:0}.chatlog{height:150px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:8px 0}.chatmsg{background:#20243b;padding:8px 10px;border-radius:8px;overflow-wrap:anywhere}.request{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #343752}.request button.deny{background:#dc4664}@media(max-width:500px){.tile,.tile video{min-height:210px}}
</style></head><body>
<header class="top"><div class="brand">orbitmeet</div><div class="meta">Live meeting room</div></header>
<main class="wrap"><div class="heading"><div><h1>Your meeting</h1><div class="meta">Share this code with your guest: <strong class="code" id="roomCode">Loading…</strong> <button class="copy" id="copy" type="button">Copy</button></div></div><a class="back" href="/">← Home</a></div>
<div class="videos"><div class="tile"><video id="localVideo" autoplay playsinline muted></video><span class="label">You</span></div><div id="remoteTiles" class="videos" style="margin:0;display:contents"></div></div>
<div class="controls"><button id="mic">🎙 Mute mic</button><button id="camera">📷 Turn camera off</button><button id="share">🖥 Share screen</button><button id="leave" class="end">Leave meeting</button></div><p id="status">Requesting camera and microphone…</p>
<div class="extras"><section class="panel"><h2>Meeting chat</h2><div id="chatlog" class="chatlog" aria-live="polite"></div><form id="chatform"><input id="chatinput" maxlength="500" placeholder="Write a message…" required style="width:72%"><button type="submit">Send</button></form></section><section class="panel" id="approvalPanel" hidden><h2>Waiting room — approve participants</h2><div id="requests">No pending requests.</div></section></div>
</main>
<script type="module">
import { createPeerConnection } from '/static/javascript/core/rtc.js';
import { connectSocket } from '/static/javascript/core/socket.js';
const params=new URLSearchParams(location.search); const room=params.get('room')?.toUpperCase(); const hostToken=params.get('host')||'';
const $=id=>document.getElementById(id), status=$('status'), localVideo=$('localVideo');
$('roomCode').textContent=room||'Missing code';
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(room);$('copy').textContent='Copied!'}catch{status.textContent='Copy failed — select the code manually.'}};
let localStream, socket, micOn=true, cameraOn=true, screenTrack=null, closed=false;
const peerId=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);
const peers=new Map(), pendingCandidates=new Map(), remoteTiles=$('remoteTiles'); let cameraTrack=null; const chatlog=$('chatlog');
function say(t){status.textContent=t}
function tileFor(id){let v=document.getElementById('video-'+id);if(!v){const box=document.createElement('div');box.className='tile';v=document.createElement('video');v.id='video-'+id;v.autoplay=true;v.playsInline=true;box.append(v);const l=document.createElement('span');l.className='label';l.textContent='Participant';box.append(l);remoteTiles.append(box)}return v}
async function send(to,data){if(socket?.readyState===WebSocket.OPEN)socket.send(JSON.stringify({to,...data}))}
async function makePeer(id,initiator){if(peers.has(id))return peers.get(id);const pc=createPeerConnection();peers.set(id,pc);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=e=>{tileFor(id).srcObject=e.streams[0]};pc.onicecandidate=e=>{if(e.candidate)send(id,{type:'candidate',candidate:e.candidate})};pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')say('Connection failed. Check network/firewall and try again.')};if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await send(id,{type:'offer',sdp:pc.localDescription})}return pc}
if(!room){say('Missing meeting code. Go back home and create/join a meeting.')}
else{
try{localStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640,max:1280},height:{ideal:360,max:720},frameRate:{ideal:20,max:24}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});cameraTrack=localStream.getVideoTracks()[0]||null;localVideo.srcObject=localStream;say('Camera ready. Waiting for another participant…');socket=connectSocket(room,peerId,async msg=>{try{
if(msg.type==='peers'){for(const id of msg.peers)if(id!==peerId&&peerId<id)await makePeer(id,true)}
else if(msg.type==='peer-joined'){if(msg.peer!==peerId&&peerId<msg.peer)await makePeer(msg.peer,true)}
else if(msg.type==='offer'){let pc=await makePeer(msg.from,false);await pc.setRemoteDescription(msg.sdp);for(const c of (pendingCandidates.get(msg.from)||[])){try{await pc.addIceCandidate(c)}catch(err){console.warn('Queued ICE candidate rejected',err)}}pendingCandidates.delete(msg.from);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await send(msg.from,{type:'answer',sdp:pc.localDescription})}
else if(msg.type==='answer'){const pc=peers.get(msg.from);if(pc){await pc.setRemoteDescription(msg.sdp);for(const c of (pendingCandidates.get(msg.from)||[])){try{await pc.addIceCandidate(c)}catch(err){console.warn('Queued ICE candidate rejected',err)}}pendingCandidates.delete(msg.from)}}
else if(msg.type==='candidate'){const pc=peers.get(msg.from);if(pc&&msg.candidate){if(pc.remoteDescription){await pc.addIceCandidate(msg.candidate)}else{if(!pendingCandidates.has(msg.from))pendingCandidates.set(msg.from,[]);pendingCandidates.get(msg.from).push(msg.candidate)}}}
else if(msg.type==='chat'){const item=document.createElement('div');item.className='chatmsg';item.textContent=(msg.name||'Participant')+': '+msg.text;chatlog.append(item);chatlog.scrollTop=chatlog.scrollHeight}
else if(msg.type==='peer-left'){peers.get(msg.peer)?.close();peers.delete(msg.peer);document.getElementById('video-'+msg.peer)?.closest('.tile')?.remove();say('A participant left.')}
}catch(e){console.error(e);say('Connection setup error: '+e.message)}});
socket.onopen=()=>say('Connected. Share the code to invite someone.');
socket.onerror=()=>say('Signaling connection failed. Refresh and try again.');
}catch(e){say('Camera/microphone unavailable: '+e.message+'. Allow browser permission and reopen the room.')}
}
$('mic').onclick=()=>{if(!localStream)return;micOn=!micOn;localStream.getAudioTracks().forEach(t=>t.enabled=micOn);$('mic').textContent=micOn?'🎙 Mute mic':'🔇 Unmute mic';$('mic').classList.toggle('off',!micOn)};
$('camera').onclick=()=>{if(!localStream)return;cameraOn=!cameraOn;localStream.getVideoTracks().forEach(t=>t.enabled=cameraOn);$('camera').textContent=cameraOn?'📷 Turn camera off':'📷 Turn camera on';$('camera').classList.toggle('off',!cameraOn)};
async function stopSharing(){if(!screenTrack)return;const old=screenTrack;screenTrack=null;old.onended=null;old.stop();for(const pc of peers.values()){const sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender&&cameraTrack)await sender.replaceTrack(cameraTrack)}localVideo.srcObject=localStream;$('share').textContent='🖥 Share screen'}
$('share').onclick=async()=>{try{if(!localStream)return;if(screenTrack){await stopSharing();return}const s=await navigator.mediaDevices.getDisplayMedia({video:true});screenTrack=s.getVideoTracks()[0];for(const pc of peers.values()){const sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(screenTrack)}localVideo.srcObject=s;screenTrack.onended=()=>{stopSharing().catch(console.error)};$('share').textContent='Stop sharing'}catch(e){say('Screen sharing cancelled or unavailable.')}};
$('chatform').addEventListener('submit',e=>{e.preventDefault();const text=$('chatinput').value.trim();if(!text||socket?.readyState!==WebSocket.OPEN)return;socket.send(JSON.stringify({type:'chat',text,name:'Participant'}));const item=document.createElement('div');item.className='chatmsg';item.textContent='You: '+text;chatlog.append(item);chatlog.scrollTop=chatlog.scrollHeight;$('chatinput').value=''});
if(hostToken){$('approvalPanel').hidden=false;async function refreshRequests(){try{const r=await fetch(`/api/room/${room}/requests?host_token=${encodeURIComponent(hostToken)}`);if(!r.ok)return;const data=await r.json();const box=$('requests');box.replaceChildren();if(!data.requests.length){box.textContent='No pending requests.';return}for(const req of data.requests){const row=document.createElement('div');row.className='request';const label=document.createElement('span');label.textContent=req.name;row.append(label);for(const decision of ['approve','deny']){const b=document.createElement('button');b.textContent=decision==='approve'?'Allow':'Deny';if(decision==='deny')b.className='deny';b.onclick=async()=>{await fetch(`/api/room/${room}/requests/${req.id}/${decision}`,{method:'POST',headers:{'X-Host-Token':hostToken}});refreshRequests()};row.append(b)}box.append(row)}}catch(e){console.error(e)}}setInterval(refreshRequests,700);refreshRequests()}
$('leave').onclick=()=>{closed=true;socket?.close();peers.forEach(p=>p.close());localStream?.getTracks().forEach(t=>t.stop());location.href='/'};
window.addEventListener('beforeunload',()=>{socket?.close();peers.forEach(p=>p.close());localStream?.getTracks().forEach(t=>t.stop())});
</script></body></html>
