<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Meet Admin</title><link rel="stylesheet" href="admin.css"><style>body{background:#090b16;color:#f5f6ff;font:15px Segoe UI,Arial;margin:0;padding:32px}main{max-width:1000px;margin:auto}a{color:#bcb4ff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:24px 0}.card,.tablewrap{background:#14172a;border:1px solid #343752;border-radius:14px;padding:18px}.card strong{display:block;font-size:28px;margin-top:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #343752}small{color:#aeb4cc}</style></head><body><main><a href="/">← Home</a><h1>Orbit Meet Admin</h1><p>Server meeting overview and recent meeting history.</p><div class="cards"><div class="card">Active rooms<strong id="active">—</strong></div><div class="card">Total meetings<strong id="total">—</strong></div></div><div class="tablewrap"><h2>Recent meetings</h2><table><thead><tr><th>Room code</th><th>Created</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="3">Loading…</td></tr></tbody></table></div><p><small>Host approval is handled by the meeting host in the room. Keep this admin page on a trusted machine/network.</small></p></main><script src="admin.js"></script></body></html>
